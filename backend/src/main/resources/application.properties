spring.application.name=demo

# Kích hoạt profile 'local' trên máy cá nhân
spring.profiles.active=local

# SQL Server (development)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ecommerce;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Web client ID that Google uses as the ID token audience. Keep the value outside source control.
google.oauth.client-id=${GOOGLE_CLIENT_ID:}

# Hibernate schema management: update existing schema while developing.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Only fields explicitly marked with @Nationalized use SQL Server NVARCHAR.
# Global nationalization makes the SQL Server driver read VARCHAR columns as NCHAR.
spring.jpa.properties.hibernate.use_nationalized_character_data=false

# Encoding HTTP UTF-8 cho tiếng Việt
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===================================================================
# CẤU HÌNH BẢO MẬT JWT (JSON WEB TOKEN)
# ===================================================================
# Khóa bí mật ký token HMAC-SHA256 (tối thiểu 256-bit)
app.jwt.secret=${JWT_SECRET}
# Thời hạn sống Access Token: 15 phút (15 * 60 * 1000 = 900000 ms)
app.jwt.access-token-expiration-ms=900000
# Thời hạn sống Refresh Token: 7 ngày (7 * 24 * 60 * 60 * 1000 = 604800000 ms)
app.jwt.refresh-token-expiration-ms=604800000

# ===================================================================
# CẤU HÌNH CỔNG THANH TOÁN VNPAY SANDBOX
# ===================================================================
vnpay.tmn-code=${VNPAY_TMN_CODE:CGXZLS0Z}
vnpay.hash-secret=${VNPAY_HASH_SECRET:XNBCJFAKAZQSGTARRLGCHVZWCIOIGSHN}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment/result}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/payment/vnpay-ipn}
